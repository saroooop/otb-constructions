# Netlify build configuration.
#
# Netlify's Next.js Runtime v5 handles the App Router and turns route handlers
# like /api/contact into Netlify Functions, so nothing in the app needs to
# change. The plugin is declared explicitly rather than left to auto-detection
# so the build is reproducible and does not shift under us.

[build]
  command = "npm run build"

[build.environment]
  # Next.js 16 needs Node 20+. Pinned rather than left to Netlify's rolling
  # default, so a platform-side bump cannot break a deploy without warning.
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# The hero film is immutable once built — a new cut would be a new deploy.
# Long cache so repeat visits do not re-download 4.6MB.
[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/disciplines/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sectors/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Baseline security headers. This site takes a contact form, so clickjacking
# and MIME sniffing are worth closing off even though there is no auth.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
